<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Chimney -->
  <rect x="108" y="34" width="11" height="26" fill="#2d4f38" rx="2"/>
  <rect x="106" y="32" width="15" height="5" fill="#2d4f38" rx="1"/>

  <!-- Roof -->
  <polygon points="80,22 130,72 30,72" fill="#2d4f38"/>
  <!-- Roof underside / fascia -->
  <polygon points="80,22 130,72 125,72 80,28 35,72 30,72" fill="#1e3a28"/>

  <!-- Walls -->
  <rect x="38" y="72" width="84" height="44" fill="#4a7c59"/>

  <!-- Left window -->
  <rect x="47" y="80" width="20" height="15" fill="white" opacity="0.92" rx="2"/>
  <line x1="57" y1="80" x2="57" y2="95" stroke="#4a7c59" stroke-width="1.2"/>
  <line x1="47" y1="87.5" x2="67" y2="87.5" stroke="#4a7c59" stroke-width="1.2"/>

  <!-- Right window -->
  <rect x="93" y="80" width="20" height="15" fill="white" opacity="0.92" rx="2"/>
  <line x1="103" y1="80" x2="103" y2="95" stroke="#4a7c59" stroke-width="1.2"/>
  <line x1="93" y1="87.5" x2="113" y2="87.5" stroke="#4a7c59" stroke-width="1.2"/>

  <!-- Door (arched) -->
  <path d="M70,116 L70,97 Q80,88 90,97 L90,116 Z" fill="white" opacity="0.92"/>

  <!-- Small tree left -->
  <polygon points="20,113 29,90 38,113" fill="#3a6647"/>
  <polygon points="17,106 29,83 41,106" fill="#2d4f38"/>
  <rect x="26" y="113" width="6" height="6" fill="#5c3a1e" rx="1"/>

  <!-- Small tree right -->
  <polygon points="122,113 131,90 140,113" fill="#3a6647"/>
  <polygon points="119,106 131,83 143,106" fill="#2d4f38"/>
  <rect x="128" y="113" width="6" height="6" fill="#5c3a1e" rx="1"/>

  <!-- Ground line -->
  <path d="M14,119 Q80,124 146,119" stroke="#4a7c59" stroke-width="1.2" fill="none" opacity="0.45"/>

  <!-- Decorative divider -->
  <line x1="52" y1="128" x2="108" y2="128" stroke="#4a7c59" stroke-width="0.8" opacity="0.5"/>
  <circle cx="80" cy="128" r="2.2" fill="#4a7c59" opacity="0.5"/>
  <circle cx="52" cy="128" r="1.2" fill="#4a7c59" opacity="0.35"/>
  <circle cx="108" cy="128" r="1.2" fill="#4a7c59" opacity="0.35"/>

  <!-- Main text: Gast auf Erden -->
  <text x="80" y="142"
    font-family="Georgia, 'Palatino Linotype', Palatino, 'Book Antiqua', serif"
    font-size="13.5"
    text-anchor="middle"
    fill="#2d4f38"
    letter-spacing="0.8">Gast auf Erden</text>

  <!-- Sub text: Hollenthon -->
  <text x="80" y="154"
    font-family="Arial, Helvetica, sans-serif"
    font-size="6.5"
    text-anchor="middle"
    fill="#6b8f71"
    letter-spacing="3">HOLLENTHON</text>
</svg>
